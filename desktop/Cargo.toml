[package]
name = "sharkcord-desktop"
description = "egui desktop app (Linux + Windows) for the unofficial sharkcordclient."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sharkcord-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# egui immediate-mode GUI (MIT-licensed), keeps the whole app MIT.
eframe = "0.31"
egui = "0.31"

[[bin]]
name = "sharkcord-desktop"
path = "src/main.rs"

# RPM packaging metadata (cargo-generate-rpm). Build the RPM with:
#   cargo install cargo-generate-rpm
#   cargo build --release --package sharkcord-desktop
#   cargo generate-rpm --package sharkcord-desktop
[package.metadata.generate-rpm]
name = "sharkcordclient"
summary = "Unofficial native client for Sharkcord"
description = """\
sharkcordclient is an unofficial, open-source, native desktop client for \
Sharkcord — the lightweight, self-hosted chat platform with text, voice, \
video, and screen sharing. Built with a Rust core and an egui UI. \
Not affiliated with the Sharkord project."""
license = "MIT"
vendor = "sharkcordclient contributors"
url = "https://github.com/martintondel02/sharkcordclient"
# Fedora 44 ships x86_64; aarch64 also common.
arch = ["x86_64", "aarch64"]
# Auto-req finds shared lib deps; we set them explicitly below to avoid
# false positives from the statically-linked Rust binary.
auto-req = "no"

[[package.metadata.generate-rpm.assets]]
source = "target/release/sharkcord-desktop"
dest = "/usr/bin/sharkcord-desktop"
mode = "0755"

[[package.metadata.generate-rpm.assets]]
source = "dist/sharkcordclient.desktop"
dest = "/usr/share/applications/sharkcordclient.desktop"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "dist/sharkcordclient.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/sharkcordclient.svg"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "dist/sharkcordclient.metainfo.xml"
dest = "/usr/share/metainfo/sharkcordclient.metainfo.xml"
mode = "0644"

# Runtime dependencies for Fedora. egui uses OpenGL/EGL/GLX + Wayland/X11
# + freetype/fontconfig. The Rust binary links them dynamically.
[package.metadata.generate-rpm.requires]
# glibc is implicit; these cover egui's rendering + windowing stack.
"mesa-libGL" = "*"
"libX11" = "*"
"libwayland-client" = "*"
"libwayland-cursor" = "*"
"libwayland-egl" = "*"
"libEGL" = "*"
"freetype" = "*"
"fontconfig" = "*"
"libstdc++" = "*"