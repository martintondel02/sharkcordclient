[package]
name = "sharkcord-desktop"
description = "egui desktop app (Linux + Windows) for the unofficial sharkcordclient."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sharkcord-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# egui immediate-mode GUI (MIT-licensed), keeps the whole app MIT.
eframe = "0.31"
egui = "0.31"

[[bin]]
name = "sharkcord-desktop"
path = "src/main.rs"